name: Publish

# Publica o pacote no NPM a partir de `master` e `beta`; tags e releases no GitHub somente em `master`.
# Qualquer outra branch (ex.: 3.0) não dispara nada.
#   master → versão final (ex.: 3.0.0)        → npm dist-tag "latest" + tag + release
#   beta   → versão com sufixo (ex.: 3.0.0-beta.2) → somente npm dist-tag "beta"
# Se a versão já estiver publicada, não publica novamente; na beta, tenta a limpeza das betas anteriores.
on:
  push:
    branches: [ master, beta ]

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Fazendo checkout do código
      - name: Checkout
        uses: actions/checkout@v4

      # Instalando NodeJs
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
          registry-url: https://registry.npmjs.org/

      # Valida a versão para a branch e verifica se ela já foi publicada
      - name: Verify version
        id: version
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          if [ "$GITHUB_REF_NAME" = "master" ] && [[ "$VERSION" == *-* ]]; then
            echo "::error::A branch master só publica versão final. Versão atual: $VERSION"
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" = "beta" ] && [[ "$VERSION" != *-beta.* ]]; then
            echo "::error::A branch beta só publica versão com sufixo beta (ex.: 3.0.0-beta.1). Versão atual: $VERSION"
            exit 1
          fi

          if [ "$GITHUB_REF_NAME" = "master" ]; then
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "dist-tag=beta" >> "$GITHUB_OUTPUT"
          fi

          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION já está publicado. Publicação ignorada."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Instalando dependências (exatamente as versões do package-lock.json)
      - name: Install dependencies
        if: steps.version.outputs.publish == 'true'
        run: npm ci

      # Verificando padrão de código
      - name: Lint
        if: steps.version.outputs.publish == 'true'
        run: npm run lint

      # Testes + build (falha se houver erro de tipo nos componentes habilitados)
      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: npm run build

      # Publica pacote no NPM
      - name: Publish NPM
        if: steps.version.outputs.publish == 'true'
        working-directory: ./dist
        run: npm publish --access public --tag ${{ steps.version.outputs.dist-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mantém apenas a beta atual, após publicar ou ao repetir a limpeza de uma versão já publicada.
      - name: Remove previous beta versions
        if: github.ref_name == 'beta'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          import { execFileSync } from "node:child_process";

          const { name, version } = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const npmJson = (...args) => JSON.parse(execFileSync("npm", [...args, "--json"], { encoding: "utf8" }));
          const published = npmJson("view", name, "versions");
          const versions = Array.isArray(published) ? published : [published];
          const currentBeta = npmJson("view", name, "dist-tags.beta");

          if (!versions.includes(version) || currentBeta !== version) {
              throw new Error(`Limpeza cancelada: ${name}@${version} precisa estar publicado e apontado pelo dist-tag beta.`);
          }

          const previousBetas = versions.filter(candidate => candidate !== version && /^\d+\.\d+\.\d+-beta(?:\.|$)/.test(candidate));
          const failures = [];

          for (const previousBeta of previousBetas) {
              const target = `${name}@${previousBeta}`;
              console.log(`Removendo ${target}`);
              try {
                  execFileSync("npm", ["unpublish", target], { stdio: "inherit" });
              } catch {
                  failures.push(target);
              }
          }

          if (failures.length > 0) {
              throw new Error(`A beta atual foi preservada, mas o npm recusou a remoção de: ${failures.join(", ")}. Confira as permissões do token e a política de unpublish do npm.`);
          }
          NODE

      # Gera a tag e o release no GitHub somente na master
      - name: Create Release
        if: github.ref_name == 'master' && steps.version.outputs.publish == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          prerelease: false
